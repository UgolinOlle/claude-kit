name: Release

# Push a tag matching package.json's version, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json
        run: |
          version=$(jq -r .version package.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != package.json v$version"; exit 1; }
      - run: bun run verify
      # One JavaScript bundle for every OS; dependencies are inlined.
      - run: bun scripts/build-release.ts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: release/npm
          if-no-files-found: error

  smoke-node:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: release/npm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Global install from the packed tarball
        shell: bash
        run: |
          (cd release/npm/claude-kit && npm pack --pack-destination ../../.. >/dev/null)
          npm install -g ./claude-kit-*.tgz
          got=$(claude-kit --version | tr -d '\r')
          want=$(jq -r .version package.json)
          [ "$got" = "$want" ] || { echo "::error::claude-kit printed '$got', expected '$want'"; exit 1; }
          # `--` keeps npx from treating --version as its own flag.
          got=$(npx --no -- claude-kit --version | tr -d '\r')
          [ "$got" = "$want" ] || { echo "::error::npx claude-kit printed '$got', expected '$want'"; exit 1; }
      - name: Commands work
        shell: bash
        run: |
          proj="$RUNNER_TEMP/proj"
          cp -R tests/fixtures/pnpm-monorepo "$proj"
          claude-kit detect --cwd "$proj"
          claude-kit init --preset full --yes --cwd "$proj"
          claude-kit doctor --check --cwd "$proj"
          # The generated edit guard must block a lockfile edit (exit 2).
          set +e
          echo '{"tool_name":"Edit","tool_input":{"file_path":"pnpm-lock.yaml"}}' \
            | CLAUDE_PROJECT_DIR="$proj" node "$proj/.claude/hooks/pre-edit.cjs"
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "::error::pre-edit hook exited $code, expected 2"; exit 1; }

  smoke-bun:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: release/npm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install with Bun and run
        shell: bash
        run: |
          (cd release/npm/claude-kit && npm pack --pack-destination ../../.. >/dev/null)
          mkdir -p bun-smoke && cd bun-smoke && bun init -y >/dev/null
          bun add ../claude-kit-*.tgz
          want=$(jq -r .version ../package.json)
          for run in "bunx claude-kit" "bunx --bun claude-kit" "bun run claude-kit"; do
            got=$($run --version | tr -d '\r')
            [ "$got" = "$want" ] || { echo "::error::$run printed '$got', expected '$want'"; exit 1; }
          done
          bunx --bun claude-kit detect --cwd ../tests/fixtures/bun-app

  publish:
    needs: [smoke-node, smoke-bun]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: release/npm
      - run: bun scripts/publish-release.ts --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
